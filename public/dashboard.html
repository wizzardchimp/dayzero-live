<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Day Zero — Live Dashboard</title>
<script src="/socket.io/socket.io.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--card:#1a1d28;--card2:#232738;--accent:#2563eb;--accent2:#3b82f6;--accent-light:#1e3a5f;--green:#10b981;--orange:#f59e0b;--red:#ef4444;--purple:#8b5cf6;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--border:#2d3142;--radius:14px;--radius-sm:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 32px;border-bottom:1px solid var(--border);flex-shrink:0}
.header-left{flex:1;display:flex;align-items:center}.header-center{flex:1;display:flex;align-items:center;justify-content:center;gap:12px}.header-right{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:16px;font-size:14px;color:var(--text2)}
.header h1{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.session-code{font-size:13px;font-weight:800;color:var(--accent2);background:var(--accent-light);padding:4px 12px;border-radius:6px;letter-spacing:3px}
.player-count{font-weight:700;color:var(--accent2);font-size:18px}
.main{flex:1;overflow-y:auto;padding:20px 32px;padding-bottom:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:16px;transition:border-color .3s}
.card.playing{border-color:var(--accent)}
.card.ready{border-color:var(--green);border-width:3px;background:rgba(16,185,129,.04)}
.card.done{border-color:var(--green)}
.card.bankrupt{border-color:var(--red)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-header-left{display:flex;align-items:center;gap:8px}
.card-name{font-size:18px;font-weight:800}
.card-remove{background:none;border:none;color:var(--text3);font-size:16px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.card-remove:hover{background:rgba(239,68,68,.15);color:var(--red)}
.card-status{font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;letter-spacing:1px;text-transform:uppercase}
.card-status.playing{background:rgba(37,99,235,.15);color:var(--accent2)}
.card-status.done{background:rgba(16,185,129,.15);color:var(--green)}
.card-status.intro{background:rgba(148,163,184,.15);color:var(--text2)}
.dc-badge{font-size:9px;font-weight:700;color:var(--red);letter-spacing:1px}
.card-body{display:flex;flex-direction:column;gap:8px}
.stat-row{display:flex;gap:8px}
.stat-box{flex:1;background:var(--card2);border-radius:var(--radius-sm);padding:10px;text-align:center}
.stat-box .label{font-size:9px;color:var(--text3);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.stat-box .value{font-size:18px;font-weight:900}
.stat-box .value.green{color:var(--green)}
.stat-box .value.red{color:var(--red)}
.stat-box .value.blue{color:var(--accent2)}
.budget-bar{height:5px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:2px}
.budget-bar-fill{height:100%;border-radius:3px;transition:width .5s,background .5s}
.budget-bar-fill.ok{background:var(--green)}
.budget-bar-fill.low{background:var(--orange)}
.budget-bar-fill.critical{background:var(--red)}
.defence-list{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.defence-item{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:8px;padding:6px 10px}
.defence-item .di-icon{font-size:22px;width:28px;text-align:center;flex-shrink:0}
.defence-item .di-name{font-size:13px;font-weight:600;color:var(--text)}
.round-dots{display:flex;gap:5px;margin-top:6px;justify-content:center}
.round-dot{width:8px;height:8px;border-radius:50%;background:var(--card2);transition:all .3s}
.round-dot.blocked{background:var(--green);box-shadow:0 0 4px rgba(16,185,129,.5)}
.round-dot.breached{background:var(--red);box-shadow:0 0 4px rgba(239,68,68,.5)}
.round-dot.future{background:var(--border)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state .big-icon{font-size:56px;margin-bottom:12px;opacity:.4}
.empty-state h2{font-size:18px;font-weight:700;color:var(--text2);margin-bottom:6px}
.empty-state p{font-size:13px;max-width:400px;margin:0 auto}
.controls-bar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);border-top:1px solid var(--border);padding:12px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-shrink:0}
.controls-left{display:flex;align-items:center;gap:16px}
.controls-center{display:flex;align-items:center;gap:8px;flex:1;justify-content:center;padding:0 16px}
.controls-right{display:flex;align-items:center;gap:12px}
.dash-timer{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;min-width:100px;text-align:center}
.dash-timer.warning{color:var(--orange)}
.dash-timer.danger{color:var(--red);animation:dashPulse .5s infinite}
.ra-chip{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--text2)}
.ra-chip .ra-icon{font-size:18px}
.ra-chip .ra-round{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:1px;margin-right:2px}
@keyframes dashPulse{0%,100%{opacity:1}50%{opacity:.5}}
.timer-adjust{width:36px;height:36px;border-radius:50%;background:var(--card2);border:1px solid var(--border);font-size:18px;font-weight:700;color:var(--text2);transition:all .2s;display:flex;align-items:center;justify-content:center}
.timer-adjust:hover{background:rgba(37,99,235,.15);color:var(--accent2);border-color:var(--accent)}
.phase-label{font-size:12px;color:var(--text3);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-right:4px}
.ctrl-btn{padding:10px 24px;border-radius:var(--radius-sm);font-size:14px;font-weight:700;transition:all .2s;letter-spacing:.5px}
.ctrl-btn.primary{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff}
.ctrl-btn.primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(37,99,235,.3)}
.ctrl-btn.primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.ctrl-btn.secondary{background:var(--card2);color:var(--text2);border:1px solid var(--border)}
.ctrl-btn.secondary:hover{background:rgba(37,99,235,.1);color:var(--accent2)}
.ctrl-btn.danger{background:linear-gradient(135deg,var(--red),#dc2626);color:#fff}
.ctrl-btn.danger:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(239,68,68,.3)}
.reveal-overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.88);animation:revIn .6s ease-out both}
.reveal-overlay.hidden{display:none}
@keyframes revIn{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.rev-icon{font-size:140px;margin-bottom:16px}
.rev-name{font-size:56px;font-weight:900;color:#fff;margin-bottom:8px}
.rev-example{font-size:20px;color:rgba(255,255,255,.7);font-style:italic;max-width:700px;text-align:center;padding:0 24px;margin-bottom:48px}
.slot-overlay{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.6);animation:pulseBg 2s ease-in-out infinite alternate}
@keyframes pulseBg{0%{background:rgba(0,0,0,.6)}100%{background:rgba(140,0,0,.7)}}
.slot-overlay.hidden{display:none}
.dash-slot-machine{background:var(--card);border-radius:var(--radius);padding:24px 16px;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.dash-slot-window{position:relative;height:450px;overflow:hidden;border-radius:var(--radius-sm);background:var(--card2);border:2px solid var(--border)}
.dash-slot-window::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(to bottom,var(--card2) 0%,transparent 28%,transparent 72%,var(--card2) 100%)}
.dash-slot-track{will-change:transform}
.dash-slot-item{height:150px;display:flex;align-items:center;justify-content:center;gap:16px;font-size:32px;font-weight:700;color:var(--text);border-bottom:1px solid var(--border)}
.dash-slot-item .dsi-icon{font-size:48px}
.dash-slot-item .dsi-name{color:var(--text2);font-size:28px}
.slot-label{color:#fff;font-size:24px;font-weight:700;margin-bottom:24px;text-align:center}
.phase-indicator{display:flex;align-items:center;gap:8px;background:var(--card2);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;color:var(--text2)}
.phase-dot{width:8px;height:8px;border-radius:50%}
.phase-dot.green{background:var(--green)}
.phase-dot.orange{background:var(--orange)}
.phase-dot.purple{background:var(--purple)}
.phase-dot.red{background:var(--red)}
#defenceGrid{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding:12px;background:var(--card2);border-radius:var(--radius-sm);justify-content:center
}
.dg-title{font-size:16px;font-weight:700;margin-bottom:8px;color:var(--text2);text-align:center}
.winner-section{text-align:center;margin-bottom:32px}
.winner-trophy{font-size:72px;margin-bottom:8px}
.winner-label{font-size:14px;color:var(--text3);font-weight:600;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
.winner-name{font-size:48px;font-weight:900;color:#fff;margin-bottom:4px;text-shadow:0 0 40px rgba(37,99,235,.4)}
.winner-award{font-size:24px;font-weight:800;margin-bottom:8px}
.winner-details{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin:8px 0 16px}
.winner-detail{background:rgba(255,255,255,.05);border-radius:var(--radius-sm);padding:10px 20px;text-align:center;min-width:120px}
.winner-detail .wd-label{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:1px;text-transform:uppercase}
.winner-detail .wd-value{font-size:18px;font-weight:800;color:#fff;margin-top:2px}
.winner-defences{margin:12px auto 24px;max-width:600px;text-align:center}
.winner-defences .wd-title{font-size:13px;color:var(--text3);font-weight:600;letter-spacing:1px;margin-bottom:8px}
.winner-defences .wd-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.winner-defences .wd-tag{background:rgba(37,99,235,.15);color:var(--accent2);border-radius:8px;padding:4px 12px;font-size:12px;font-weight:500}
.winner-rounds{max-width:500px;margin:0 auto 24px}
.winner-round{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border-radius:var(--radius-sm);padding:8px 16px;margin-bottom:6px;font-size:14px}
.winner-round .wr-icon{font-size:20px;width:28px;text-align:center}
.winner-round .wr-name{flex:1;font-weight:600;color:rgba(255,255,255,.8)}
.winner-round .wr-result{font-size:11px;font-weight:700;padding:3px 10px;border-radius:6px;letter-spacing:1px}
.winner-round .wr-result.blocked{background:rgba(16,185,129,.2);color:var(--green)}
.winner-round .wr-result.breached{background:rgba(239,68,68,.2);color:var(--red)}
.ranking-container{max-width:900px;width:100%;margin:0 auto}
.ranking-title{font-size:22px;font-weight:900;margin-bottom:20px;text-align:center;color:rgba(255,255,255,.7)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-bottom:32px}
.podium-item{text-align:center;border-radius:var(--radius);padding:20px 24px;min-width:180px;transition:all .3s}
.podium-item.gold{background:linear-gradient(135deg,#f59e0b,#d97706);order:2;padding-bottom:32px}
.podium-item.silver{background:linear-gradient(135deg,#94a3b8,#64748b);order:1;padding-bottom:16px}
.podium-item.bronze{background:linear-gradient(135deg,#cd7f32,#a0522d);order:3;padding-bottom:12px}
.podium-rank{font-size:32px;font-weight:900;color:#fff;margin-bottom:4px}
.podium-name{font-size:20px;font-weight:800;color:#fff;margin-bottom:4px}
.podium-score{font-size:14px;color:rgba(255,255,255,.8)}
.podium-priority{font-size:12px;color:rgba(255,255,255,.7);margin-bottom:4px}
.podium-budget{font-size:16px;font-weight:700;color:rgba(255,255,255,.9);margin-top:4px}
.podium-award{display:inline-block;font-size:28px;margin-top:6px}
.ranking-table{background:rgba(255,255,255,.05);border-radius:var(--radius);overflow:hidden}
.ranking-row{display:grid;grid-template-columns:50px 1fr 120px 120px 100px;align-items:center;padding:10px 20px;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;color:rgba(255,255,255,.8)}
.ranking-row:last-child{border-bottom:none}
.ranking-row.header{font-size:11px;color:rgba(255,255,255,.4);font-weight:600;letter-spacing:1px;text-transform:uppercase}
.ranking-row .rr-rank{font-weight:800;font-size:16px;text-align:center}
.ranking-row .rr-name{font-weight:700;text-align:left}
.ranking-row .rr-priority{text-align:center;font-size:13px}
.ranking-row .rr-budget{text-align:right;font-weight:700;font-family:monospace}
.ranking-row .rr-award{text-align:center;font-size:18px}
</style>
</head>
<body>
<div class="header">
  <div class="header-left"><span class="session-code" id="session-code"></span></div>
  <div class="header-center">
    <h1>DAY ZERO LIVE</h1>
  </div>
  <div class="header-right">
    <span class="phase-indicator" id="phase-indicator"><span class="phase-dot orange" id="phase-dot"></span><span id="phase-label">Lobby</span></span>
    <span>Players: <span class="player-count" id="player-count">0</span></span>
  </div>
</div>
<div class="main">
  <div class="grid" id="grid"></div>
</div>
<div class="controls-bar">
  <div class="controls-left">
    <div class="phase-label">Timer</div>
    <div class="dash-timer" id="dash-timer">02:00</div>
    <button class="timer-adjust" id="timer-dec">−</button>
    <button class="timer-adjust" id="timer-inc">+</button>
  </div>
  <div class="controls-right">
    <button class="ctrl-btn primary" id="btn-start-game" style="display:none">Start Game</button>
    <button class="ctrl-btn danger" id="btn-flush-players" style="display:none">Flush Players</button>
    <button class="ctrl-btn secondary" id="btn-force-end" style="display:none">Force End Round</button>
    <button class="ctrl-btn primary" id="btn-next-round" style="display:none">Start Next Round</button>
  </div>
  <div class="controls-center" id="round-attacks-bar"></div>
</div>
<div class="slot-overlay hidden" id="slot-overlay">
  <div class="slot-label">Incoming Attack...</div>
  <div class="dash-slot-machine"><div class="dash-slot-window"><div class="dash-slot-track" id="dash-slot-track"></div></div></div>
</div>
<div class="reveal-overlay hidden" id="reveal-overlay">
  <div class="rev-icon" id="rev-icon">🎣</div>
  <div class="rev-name" id="rev-name">Phishing</div>
  <div class="rev-example" id="rev-example">e.g. An email from your "CEO" requests urgent gift card purchases</div>
  <button class="ctrl-btn primary" id="btn-reveal-next" style="font-size:18px;padding:14px 48px">Start Next Round</button>
</div>
<div class="reveal-overlay hidden" id="gameover-reveal" style="background:rgba(0,0,0,.88);overflow-y:auto">
  <div class="winner-section" id="winner-section">
    <div class="winner-trophy" id="winner-trophy">🏆</div>
    <div class="winner-label">WINNER</div>
    <div class="winner-name" id="winner-name">—</div>
    <div class="winner-award" id="winner-award"></div>
    <div class="winner-details" id="winner-details"></div>
    <div class="winner-defences" id="winner-defences"></div>
    <div class="winner-rounds" id="winner-rounds"></div>
  </div>
  <div class="ranking-container" id="ranking-container">
    <div class="ranking-title">Final Standings</div>
    <div class="podium" id="podium"></div>
    <div class="ranking-table" id="ranking-table"></div>
  </div>
  <button class="ctrl-btn secondary" id="btn-toggle-tiles" style="font-size:14px;padding:10px 24px;margin-top:12px">Hide Player Tiles</button>
  <button class="ctrl-btn primary" id="btn-gov-lobby" style="font-size:18px;padding:14px 48px;margin-top:12px">Return to Lobby</button>
</div>
<audio id="dash-music" loop src="music.mp3"></audio>
<audio id="dash-drumroll" src="drumroll.mp3"></audio>
<audio id="dash-win" src="win.mp3"></audio>
<audio id="dash-lose" src="lose.mp3"></audio>
<script>
const socket=io();

const ATTACKS={
  phishing:'🎣',malware:'🦠',ransomware:'🔒',ddos:'🌊',
  sql_injection:'💉',mitm:'👤',zero_day:'⚡',insider:'🏢',
  data_exfil:'📤',social_eng:'🎭'
};
const ATTACK_DATA=[
  {id:'phishing',name:'Phishing',icon:'🎣',desc:'Deceptive emails to steal credentials',example:'An email from your "CEO" requests urgent gift card purchases'},
  {id:'malware',name:'Malware',icon:'🦠',desc:'Malicious software to compromise systems',example:'An innocent-looking PDF attachment installs a keylogger'},
  {id:'ransomware',name:'Ransomware',icon:'🔒',desc:'Encrypts data and demands payment',example:'All company files encrypted — pay 10 BTC within 48 hours'},
  {id:'ddos',name:'DDoS',icon:'🌊',desc:'Overwhelming traffic to disrupt services',example:'Website returns 503 errors under 500Gbps traffic flood'},
  {id:'sql_injection',name:'SQL Injection',icon:'💉',desc:'Database manipulation via input fields',example:'Login form accepts "\' OR 1=1 —" as valid credentials'},
  {id:'mitm',name:'Man-in-the-Middle',icon:'👤',desc:'Intercepting communications between parties',example:'Coffee-shop WiFi injects malicious code into every page you load'},
  {id:'zero_day',name:'Zero-Day Exploit',icon:'⚡',desc:'Attacking unknown vulnerabilities',example:'An unpatched router vulnerability gives attackers full network access'},
  {id:'insider',name:'Insider Threat',icon:'🏢',desc:'Malicious or negligent internal actors',example:'A departing employee copies the entire client database before leaving'},
  {id:'data_exfil',name:'Data Exfiltration',icon:'📤',desc:'Stealing sensitive data from systems',example:'Sensitive spreadsheets are uploaded to a personal cloud account'},
  {id:'social_eng',name:'Social Engineering',icon:'🎭',desc:'Psychological manipulation to gain access',example:'Caller posing as IT support asks you to "verify" your password'}
];
const DEFENCE_DATA=[
  {id:'firewall',name:'Firewall',icon:'🛡️',desc:'Monitors and controls network traffic'},
   {id:'endpoint',name:'Endpoint Protection',icon:'💻',desc:'secure individual devices'},
  {id:'mfa',name:'Multi-Factor Auth',icon:'🔐',desc:'Requires multiple verification methods'},
  {id:'encryption',name:'Encryption',icon:'🔒',desc:'Scrambles data to prevent unauthorised access'},
   {id:'seg',name:'Network Segmentation',icon:'🔀',desc:'seperates the network into departmental areas'},
  {id:'backup',name:'Backup & Recovery',icon:'💾',desc:'Restores data after loss or attack'},
   {id:'threat',name:'Threat Detection',icon:'👁️',desc:'uses AI to monitor network usage of individuals'},
  {id:'passwords',name:'Improved User Passwords',icon:'🔑',desc:'Enforces strong password policies'},
  {id:'training',name:'Security Training',icon:'📚',desc:'Educates users to recognise threats'},
  {id:'monitoring',name:'Continuous Monitoring',icon:'📊',desc:'Tracks systems for unusual behaviour'}
];
const DEFENCE_NAMES={
  firewall:'Firewall',endpoint:'Endpoint Protection',mfa:'Multi-Factor Auth',encryption:'Encryption',
  seg:'Network Segmentation',backup:'Backup & Recovery',threat:'Threat Detection',
  passwords:'Improved Passwords',training:'Security Training',monitoring:'Continuous Monitoring'
};
const DEFENCE_ICONS={
  firewall:'🛡️',endpoint:'💻',mfa:'🔐',encryption:'🔒',
  seg:'🔀',backup:'💾',threat:'👁️',
  passwords:'🔑',training:'📚',monitoring:'📊'
};

const $=id=>document.getElementById(id);
const grid=$('grid'),playerCount=$('player-count'),sessionCode=$('session-code');
const dashTimer=$('dash-timer'),timerDec=$('timer-dec'),timerInc=$('timer-inc');
const btnStartGame=$('btn-start-game'),btnFlush=$('btn-flush-players'),btnForceEnd=$('btn-force-end'),btnNextRound=$('btn-next-round');
const slotOverlay=$('slot-overlay'),dashSlotTrack=$('dash-slot-track'),slotLabel=$('slot-label');
const revealOverlay=$('reveal-overlay'),revIcon=$('rev-icon'),revName=$('rev-name'),revExample=$('rev-example'),btnRevealNext=$('btn-reveal-next');
const gameoverReveal=$('gameover-reveal'),govName=$('gov-name'),govSub=$('gov-sub'),btnGovLobby=$('btn-gov-lobby');
const phaseIndicator=$('phase-indicator'),phaseDot=$('phase-dot'),phaseLabel=$('phase-label');
const roundAttacksBar=$('round-attacks-bar'),btnToggleTiles=$('btn-toggle-tiles');

const dashMusic=$('dash-music'),dashDrumroll=$('dash-drumroll'),dashWin=$('dash-win'),dashLose=$('dash-lose');

let currentPhase='lobby';
let currentAttack=null;
let roundAttacks=[];

let lastPlayers=[];

const PRIORITY_EMOJIS={'Money':'💰','Data':'💾','Maintain Services':'⚙️'};
const ATTACK_NAMES={phishing:'Phishing',malware:'Malware',ransomware:'Ransomware',ddos:'DDoS',sql_injection:'SQL Injection',mitm:'MITM',zero_day:'Zero-Day',insider:'Insider Threat',data_exfil:'Data Exfiltration',social_eng:'Social Engineering'};
const ATTACK_ICONS={phishing:'🎣',malware:'🦠',ransomware:'🔒',ddos:'🌊',sql_injection:'💉',mitm:'👤',zero_day:'⚡',insider:'🏢',data_exfil:'📤',social_eng:'🎭'};

function stopAllAudio(){
  dashMusic.pause();dashMusic.currentTime=0;
  dashDrumroll.pause();dashDrumroll.currentTime=0;
}

function playMusic(){dashMusic.currentTime=0;dashMusic.play().catch(()=>{})}
function playDrumroll(){dashDrumroll.currentTime=0;dashDrumroll.play().catch(()=>{})}
function playWin(){dashWin.currentTime=0;dashWin.play().catch(()=>{})}
function playLose(){dashLose.currentTime=0;dashLose.play().catch(()=>{})}


function budgetPct(b){return Math.max(0,Math.min(100,(b/300000)*100))}
function budgetClass(b){const p=b/300000;return p<=0.25?'critical':p<=0.5?'low':'ok'}

function formatTime(s){
  const m=Math.floor(s/60),sec=s%60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function renderCards(players){
  playerCount.textContent=players.length;
  if(players.length===0){
    grid.innerHTML=`<div class="empty-state"><div class="big-icon">📡</div><h2>Waiting for players</h2><p>Share the link with your team and their cards will appear here as they join.</p></div>`;
    return;
  }
  const sorted = currentPhase==='lobby' ? players : [...players].sort((a,b)=>b.budget-a.budget);
  grid.innerHTML=sorted.map(p=>{
    const r=currentPhase==='reveal'||currentPhase==='gameover'?3:(currentPhase==='selecting'?p.defences.length:0);
    const dots='';
    let dotsHtml='<div class="round-dots">';
    for(let i=0;i<3;i++){
      if(i<p.breaches+p.blocked||(currentPhase==='gameover')){
        const known=!!p.lastAttack;
        dotsHtml+=`<div class="round-dot ${known?'blocked':'blocked'}" title="Round ${i+1}"></div>`;
      }else if(i===p.blocked+p.breaches&&currentPhase==='selecting'){
        dotsHtml+=`<div class="round-dot future" style="border:2px solid var(--accent);background:transparent" title="Round ${i+1} active"></div>`;
      }else{
        dotsHtml+=`<div class="round-dot future" title="Round ${i+1}"></div>`;
      }
    }
    dotsHtml+='</div>';
    const defs=p.defences||[];
    const bc=budgetClass(p.budget);
    const readyClass=currentPhase==='selecting'&&p.selected&&p.selected.length>=p.maxSelect?' ready':'';
    const priReady=currentPhase==='priority'&&p.priority&&p.priority.length===3?' ready':'';
    return `<div class="card ${currentPhase==='selecting'?'playing':currentPhase==='gameover'?(p.budget>0?'done':'bankrupt'):''}${readyClass}${priReady}" data-id="${p.id}">
      <div class="card-header">
        <div class="card-header-left">
          <div class="card-name">${p.name}</div>
          <div class="card-status ${currentPhase==='priority'?'intro':currentPhase==='selecting'?'playing':''}">${currentPhase==='priority'?(p.priority&&p.priority.length===3?'Ready':'Waiting'):(p.selected.length+'/'+p.maxSelect)}</div>${!p.connected?'<div class="dc-badge">DISCONNECTED</div>':''}
        </div>
        <button class="card-remove" data-id="${p.id}" title="Remove player">✕</button>
      </div>
      <div class="card-body">
        <div class="stat-row">
          <div class="stat-box"><div class="label">Blocked</div><div class="value green">${p.blocked||0}</div></div>
          <div class="stat-box"><div class="label">Breaches</div><div class="value red">${p.breaches||0}</div></div>
          <div class="stat-box"><div class="label">Budget</div><div class="value ${bc}">£${(p.budget||0).toLocaleString()}</div></div>
        </div>
        <div><div class="budget-bar"><div class="budget-bar-fill ${bc}" style="width:${budgetPct(p.budget)}%"></div></div></div>
        ${defs.length?`<div class="defence-list">${defs.map(d=>`<div class="defence-item"><span class="di-icon">${DEFENCE_ICONS[d]||'🛡️'}</span><span class="di-name">${DEFENCE_NAMES[d]||d}</span></div>`).join('')}</div>`:''}
        ${p.priority&&p.priority.length?`<div style="font-size:11px;color:var(--text3);margin-top:4px;text-align:center">Priority: ${p.priority.map((x,i)=>`${PRIORITY_EMOJIS[x]||''} ${i+1}st:${x}`).join(' · ')}</div>`:''}
        ${p.award?`<div style="font-size:13px;font-weight:700;text-align:center;margin-top:4px;color:${p.award==='Gold'?'#f59e0b':p.award==='Silver'?'#94a3b8':'#cd7f32'}">${p.award==='Gold'?'🏆':p.award==='Silver'?'🥈':'🥉'} ${p.award}</div>`:''}
        ${dotsHtml}
      </div>
    </div>`;
  }).join('');
}

function updatePhase(gs){
  const phases={lobby:'Lobby',priority:'Set Priority',selecting:'Round '+gs.round,spinning:'Spinning...',reveal:'Reveal',gameover:'Game Over'};
  phaseLabel.textContent=phases[gs.phase]||gs.phase;
  const colors={lobby:'orange',priority:'purple',selecting:'green',spinning:'purple',reveal:'purple',gameover:'red'};
  phaseDot.className='phase-dot '+(colors[gs.phase]||'orange');
}

function updateButtons(gs){
  btnStartGame.style.display='none';
  btnForceEnd.style.display='none';
  btnNextRound.style.display='none';
  if(gs.phase==='lobby'){
    btnStartGame.style.display='';
    btnStartGame.disabled=false;
    btnStartGame.textContent='Start Game';
  }else if(gs.phase==='priority'){
    btnStartGame.style.display='';
    btnStartGame.disabled=lastPlayers.length===0;
    btnStartGame.textContent='Start Round 1';
  }else if(gs.phase==='selecting'){
    btnForceEnd.style.display='';
    btnForceEnd.textContent='Force End Round';
  }else if(gs.phase==='reveal'){
    btnNextRound.style.display='';
    btnNextRound.textContent=gs.round>=3?'End Game':'Start Round '+(gs.round+1);
  }else if(gs.phase==='gameover'){
    btnNextRound.style.display='';
    btnNextRound.textContent='Return to Lobby';
  }
}

function showSlotMachine(attack){
  if(!attack)return;
  slotOverlay.classList.remove('hidden');
  revealOverlay.classList.add('hidden');
  gameoverReveal.classList.add('hidden');
  const ih=150,cycles=5;
  const atts=Object.keys(ATTACKS).map(id=>{
    const names={phishing:'Phishing',malware:'Malware',ransomware:'Ransomware',ddos:'DDoS',sql_injection:'SQL Injection',mitm:'MITM',zero_day:'Zero-Day',insider:'Insider Threat',data_exfil:'Data Exfiltration',social_eng:'Social Engineering'};
    return {id,icon:ATTACKS[id],name:names[id]||id};
  });
  const targetIdx=atts.findIndex(a=>a.id===attack.id);
  if(targetIdx<0)return;
  dashSlotTrack.innerHTML='';
  for(let c=0;c<cycles+1;c++)atts.forEach(a=>{
    const d=document.createElement('div');d.className='dash-slot-item';
    d.innerHTML='<span class="dsi-icon">'+a.icon+'</span><span class="dsi-name">'+a.name+'</span>';
    dashSlotTrack.appendChild(d);
  });
  atts.slice(0,2).forEach(a=>{
    const d=document.createElement('div');d.className='dash-slot-item';
    d.innerHTML='<span class="dsi-icon">'+a.icon+'</span><span class="dsi-name">'+a.name+'</span>';
    dashSlotTrack.appendChild(d);
  });
  const tgi=cycles*atts.length+targetIdx,endY=(tgi-1)*ih,duration=10000,st=performance.now();
  function eo(t){return 1-Math.pow(1-t,3)}
  function an(now){
    const elapsed=now-st,progress=Math.min(elapsed/duration,1),cur=eo(progress)*endY;
    dashSlotTrack.style.transform='translateY(-'+cur+'px)';
    if(progress<1)requestAnimationFrame(an);
  }
  requestAnimationFrame(an);
}

function showReveal(attack){
  if(!attack)return;
  slotOverlay.classList.add('hidden');
  revIcon.textContent=attack.icon;
  revName.textContent=attack.name;
  revExample.textContent='e.g. '+attack.example;
  revealOverlay.classList.remove('hidden');
}

function updateRoundAttacks(){
  roundAttacksBar.innerHTML=roundAttacks.map((a,i)=>`<div class="ra-chip"><span class="ra-round">RD${i+1}</span><span class="ra-icon">${a.icon||''}</span><span>${a.name||''}</span></div>`).join('');
}

function renderWinner(players){
  if(!players||players.length===0){
    $('winner-trophy').style.display='none';
    $('podium').innerHTML='';$('ranking-table').innerHTML='<div style="text-align:center;padding:32px;color:rgba(255,255,255,.4)">No players</div>';
    $('winner-rounds').innerHTML='';
    return;
  }
  $('winner-trophy').style.display='none';
  const sorted=[...players].sort((a,b)=>(b.score||0)-(a.score||0));
  const top3=sorted.slice(0,3);

  // Podium
  const podiumEl=$('podium');
  podiumEl.innerHTML='';
  const rankLabels=['🥇','🥈','🥉'];
  const rankClasses=['gold','silver','bronze'];
  top3.forEach((p,i)=>{
    const div=document.createElement('div');
    div.className='podium-item '+rankClasses[i];
    const pr=p.priority&&p.priority[0]?`${PRIORITY_EMOJIS[p.priority[0]]||''} ${p.priority[0]}`:'—';
    div.innerHTML=`<div class="podium-rank">${rankLabels[i]}</div><div class="podium-name">${p.name}</div><div class="podium-priority">${pr}</div><div class="podium-score">Score: ${p.score||0}</div><div class="podium-budget">£${(p.budget||0).toLocaleString()}</div><div class="podium-award">${p.award==='Gold'?'🏆':p.award==='Silver'?'🥈':p.award==='Bronze'?'🥉':'—'}</div>`;
    podiumEl.appendChild(div);
  });
  if(podiumEl.children.length<3){
    for(let i=podiumEl.children.length;i<3;i++){
      const div=document.createElement('div');
      div.className='podium-item silver';div.style.background='rgba(255,255,255,.05)';
      div.innerHTML='<div class="podium-name" style="color:rgba(255,255,255,.3)">—</div>';
      podiumEl.appendChild(div);
    }
  }

  // Full ranking table
  const tableEl=$('ranking-table');
  tableEl.innerHTML='<div class="ranking-row header"><span class="rr-rank">Rank</span><span class="rr-name">Name</span><span class="rr-priority">Priority</span><span class="rr-budget">Budget</span><span class="rr-award">Award</span></div>';
  sorted.forEach((p,i)=>{
    const row=document.createElement('div');
    row.className='ranking-row';
    const pr=p.priority&&p.priority.length>0?p.priority.map((x,i)=>`${PRIORITY_EMOJIS[x]||''}${i+1}st:${x}`).join(' | '):'—';
    row.innerHTML=`<span class="rr-rank">#${i+1}</span><span class="rr-name">${p.name}</span><span class="rr-priority">${pr}</span><span class="rr-budget">£${(p.budget||0).toLocaleString()}</span><span class="rr-award">${p.award==='Gold'?'🏆 Gold':p.award==='Silver'?'🥈 Silver':p.award==='Bronze'?'🥉 Bronze':'—'}</span>`;
    tableEl.appendChild(row);
  });

  // Attacks faced section
  const winner=sorted[0];
  const roundsEl=$('winner-rounds');
  const history=winner&&winner.roundHistory||[];
  if(history.length){
    roundsEl.innerHTML='<div class="wd-title" style="margin-bottom:10px;text-align:center;font-size:16px;font-weight:700;color:var(--text2)">ALL ATTACKS</div>'+
      history.map((r,i)=>{
        const icon=ATTACK_ICONS[r.attackId]||'🔓';
        const name=ATTACK_NAMES[r.attackId]||r.attackId;
        const cls=r.blocked?'blocked':'breached';
        const label=r.blocked?'BLOCKED':'BREACHED';
        return `<div class="winner-round"><span class="wr-icon">${icon}</span><span class="wr-name">${name}</span><span class="wr-result ${cls}">${label}</span></div>`;
      }).join('');
    roundsEl.style.display='';
  }else roundsEl.innerHTML='';
}

function showGameOver(){
  slotOverlay.classList.add('hidden');
  revealOverlay.classList.add('hidden');
  renderWinner(lastPlayers);
  gameoverReveal.classList.remove('hidden');
}

function hideAll(){
  slotOverlay.classList.add('hidden');
  revealOverlay.classList.add('hidden');
  gameoverReveal.classList.add('hidden');
}

// Socket events
socket.on('connect',()=>console.log('Dashboard connected'));

socket.on('game-state',(gs)=>{
  const prevPhase=currentPhase;
  currentPhase=gs.phase;
  currentAttack=gs.currentAttack;
  updatePhase(gs);
  updateButtons(gs);
  sessionCode.textContent=gs.sessionCode?'CODE '+gs.sessionCode:'';
  btnFlush.style.display=gs.phase==='lobby'?'':'none';
  if(gs.phase==='lobby'){
    hideAll();
    stopAllAudio();
    roundAttacks=[];
    updateRoundAttacks();
    btnStartGame.textContent='Start Game';
  }else if(gs.phase==='priority'){
    hideAll();
    stopAllAudio();
    btnStartGame.textContent='Start Round 1';
  }else if(gs.phase==='selecting'){
    hideAll();
    dashTimer.className='dash-timer';
    if(prevPhase!=='selecting')playMusic();
    updateRoundAttacks();
  }else if(gs.phase==='spinning'){
    showSlotMachine(gs.currentAttack);
    stopAllAudio();
    playDrumroll();
    if(gs.currentAttack){roundAttacks.push(gs.currentAttack);updateRoundAttacks()}
  }else if(gs.phase==='reveal'){
    showReveal(gs.currentAttack);
    stopAllAudio();
  }else if(gs.phase==='gameover'){
    showGameOver();
    stopAllAudio();
  }
});

socket.on('players-update',(players)=>{
  lastPlayers=players;
  renderCards(players);
  if(currentPhase==='gameover')renderWinner(players);
  if(currentPhase==='priority')updateButtons({phase:'priority'});
});

socket.on('timer-update',(remaining)=>{
  dashTimer.textContent=formatTime(remaining);
  dashTimer.className='dash-timer'+(remaining<=10?' danger':remaining<=30?' warning':'');
});

// Controls
btnStartGame.addEventListener('click',()=>{
  btnStartGame.disabled=true;
  if(currentPhase==='priority'){
    btnStartGame.textContent='Starting...';
    socket.emit('start-first-round');
  }else{
    btnStartGame.textContent='Starting...';
    socket.emit('start-game');
  }
});

btnForceEnd.addEventListener('click',()=>{
  socket.emit('adjust-timer',-9999);
});

btnFlush.addEventListener('click',()=>{
  if(confirm('Remove all players from the lobby?')){
    socket.emit('flush-players');
  }
});

btnNextRound.addEventListener('click',()=>{
  if(currentPhase==='gameover'){
    socket.emit('reset-game');
  }else{
    socket.emit('start-next-round');
  }
});

btnRevealNext.addEventListener('click',()=>{
  socket.emit('start-next-round');
});

btnGovLobby.addEventListener('click',()=>{
  socket.emit('reset-game');
});

btnToggleTiles.addEventListener('click',()=>{
  const hidden=grid.style.display==='none';
  grid.style.display=hidden?'':'none';
  btnToggleTiles.textContent=hidden?'Hide Player Tiles':'Show Player Tiles';
});

// Remove player via delegated click on grid
grid.addEventListener('click',(e)=>{
  const btn=e.target.closest('.card-remove');
  if(!btn)return;
  const id=btn.dataset.id;
  if(confirm('Remove this player? They can rejoin with the same session code.')){
    socket.emit('remove-player',id);
  }
});

timerDec.addEventListener('click',()=>socket.emit('adjust-timer',-30));
timerInc.addEventListener('click',()=>socket.emit('adjust-timer',30));

document.addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
  }
});

// Initial state
renderCards([]);
</script>
</body>
</html>
