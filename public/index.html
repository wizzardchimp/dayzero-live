<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Day Zero Live</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{
      font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
      background:#0f1117;
      color:#fff;
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
    }
    .stage{
      position:relative;
      width:100vw;
      height:100vh;
      background-image:url('/Landing.png');
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-end;
      padding-bottom:22vh;
    }
    .stage::after{
      content:'';
      position:absolute;
      inset:0;
      background:radial-gradient(ellipse at center,rgba(0,0,0,.12) 0%,rgba(0,0,0,.55) 100%);
      pointer-events:none;
    }
    .content{
      position:relative;
      z-index:2;
      text-align:center;
      padding:24px;
    }
    .btn-start{
      display:inline-flex;
      align-items:center;
      gap:12px;
      padding:20px 56px;
      border:none;
      border-radius:16px;
      font-size:20px;
      font-weight:800;
      letter-spacing:1px;
      text-transform:uppercase;
      color:#fff;
      background:linear-gradient(135deg,#ef4444,#b91c1c);
      box-shadow:0 10px 40px rgba(239,68,68,.45);
      cursor:pointer;
      text-decoration:none;
      transition:transform .2s,box-shadow .2s;
      animation:glow 2.2s ease-in-out infinite;
    }
    .btn-start:hover{
      transform:translateY(-3px) scale(1.03);
      box-shadow:0 16px 56px rgba(220,38,38,.55);
    }
    .btn-start:active{transform:translateY(0) scale(.98)}
    .btn-start .ic{font-size:26px}
    @keyframes glow{
      0%,100%{box-shadow:0 10px 40px rgba(239,68,68,.45)}
      50%{box-shadow:0 10px 60px rgba(220,38,38,.75)}
    }
    .hint{
      position:relative;
      z-index:2;
      margin-top:28px;
      font-size:14px;
      color:rgba(255,255,255,.75);
      letter-spacing:.5px;
    }
    @media(max-width:600px){
      .btn-start{padding:18px 40px;font-size:18px}
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="content">
      <a class="btn-start" href="/dashboard.html"><span class="ic">🛡️</span>Start</a>
      <div class="hint">Smartphone players scan the QR code on the dashboard</div>
    </div>
  </div>
</body>
</html>
