<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Day Zero Live</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1117;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
    .card{background:#1a1d28;border:1px solid #2d3142;border-radius:14px;padding:28px 32px;text-align:center;max-width:420px}
    .card h1{font-size:22px;margin:0 0 8px}
    .card p{color:#94a3b8;margin:0 0 20px}
    a{display:inline-block;margin:6px 8px;padding:10px 18px;border-radius:8px;text-decoration:none;font-weight:700}
    .dash{background:#2563eb;color:#fff}
    .play{background:#1a1a2e;color:#e2e8f0;border:1px solid #2d3142}
    a:hover{filter:brightness(1.1)}
  </style>
</head>
<body>
  <div class="card">
    <h1>Day Zero Live</h1>
    <p>Choose how you want to join</p>
    <div>
      <a class="dash" href="/dashboard.html">Open Dashboard</a>
      <a class="play" href="/play.html">Join as Player</a>
    </div>
  </div>
</body>
</html>
